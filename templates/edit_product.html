
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="main-content">

        <header class="dashboard-header">
            <div>
                <h1>Edit Product</h1>
                <p>Update product information</p>
            </div>
            <a href="/products">Back to Products</a>
        </header>

        <section class="module-card">

            <form action="/web/products/edit/{{ product.id }}"
                  method="POST">

                <input type="text" name="product_name"
                       value="{{ product.product_name }}" required>

                <input type="text" name="sku"
                       value="{{ product.sku }}" required>

                <textarea name="description" rows="3">{{ product.description or '' }}</textarea>

                <input type="text" name="category"
                       value="{{ product.category }}" required>

                <input type="number" name="unit_price"
                       value="{{ product.unit_price }}"
                       min="0.01" step="0.01" required>

                <select name="supplier_id" required>
                    {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}"
                            {% if supplier.id == product.supplier_id %}
                                selected
                            {% endif %}>
                            {{ supplier.supplier_name }}
                        </option>
                    {% endfor %}
                </select>

                <label>Expiry Tracking</label>
                <select name="has_expiry" required>
                    <option value="false"
                        {% if not product.has_expiry %}selected{% endif %}>
                        No - FIFO
                    </option>

                    <option value="true"
                        {% if product.has_expiry %}selected{% endif %}>
                        Yes - FEFO
                    </option>
                </select>

                <button type="submit">Update Product</button>

            </form>

        </section>

    </div>

</body>
</html>
